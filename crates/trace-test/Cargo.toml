[package]
name = "trace-test"
version = "0.1.0"
edition = "2021"
authors = ["Stria Systems <engineering@stria.io>"]
description = "CLI tool for adversarial testing and CI integration of the Trace proxy"
license = "Proprietary"

[[bin]]
name = "trace-test"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# CLI arg parsing
clap = { version = "4", features = ["derive", "color", "env"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Output formatting
colored = "2"
tabled = "0.15"

# Error handling
anyhow = "1.0"

# Timing
tokio-time = { package = "tokio", version = "1.35", features = ["time"] }

# UUIDs
uuid = { version = "1.6", features = ["v4"] }

# File I/O for batch test files
serde_yaml = "0.9"
